{% extends 'layouts/dashboard_base.html' %}

{% block title %}ChemLove | Assignments Board{% endblock %}

{% block dashboard_content %}
    <!-- Header -->
    <div class="mb-12">
        <div class="inline-flex items-center gap-2 bg-primary-container/20 text-primary px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-4">
            <span class="w-2 h-2 rounded-full bg-primary live-pulse"></span>
            Task board
        </div>
        <h1 class="text-4xl md:text-5xl font-black tracking-tight leading-none uppercase">Assignments</h1>
        <p class="text-slate-400 mt-2 text-sm">Track your homework worksheets, submit laboratory reports, and view evaluation feedback.</p>
    </div>

    <!-- Assignments Board -->
    <div id="assignments-board" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-24">
        <!-- Spinner while loading -->
        <div class="col-span-full flex justify-center py-12" id="board-spinner">
            <div class="w-8 h-8 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    async function loadAssignments() {
        const board = document.getElementById('assignments-board');
        try {
            const res = await fetch('/api/assignments');
            const data = await res.json();
            
            const spinner = document.getElementById('board-spinner');
            if (spinner) spinner.remove();
            
            const list = data.assignments || [];
            if (list.length === 0) {
                board.innerHTML = `
                    <div class="col-span-full glass-morphism p-12 rounded-3xl text-center">
                        <span class="material-symbols-outlined text-5xl text-slate-600 mb-4">assignment</span>
                        <h3 class="text-lg font-bold text-white uppercase mb-2">No Assignments Scheduled</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto">You're all caught up! When a teacher publishes homework, it will appear here.</p>
                    </div>
                `;
                return;
            }
            
            board.innerHTML = '';
            list.forEach(a => {
                const isSubmitted = a.submission_status ? true : false;
                const statusColor = isSubmitted ? (a.submission_status === 'approved' ? 'text-green-400 border-green-500/20 bg-green-950/20' : 'text-yellow-400 border-yellow-500/20 bg-yellow-950/20') : 'text-red-400 border-red-500/20 bg-red-950/20';
                const statusLabel = isSubmitted ? (a.submission_status === 'approved' ? 'Graded & Approved' : 'Submitted (Pending)') : 'Pending Submission';
                
                let feedbackHtml = '';
                if (a.feedback) {
                    feedbackHtml = `
                        <div class="mt-4 border-t border-white/5 pt-4">
                            <span class="text-[9px] font-black uppercase tracking-widest text-slate-500 block mb-1">Teacher Feedback</span>
                            <p class="text-[10px] text-slate-400 italic bg-black/20 p-3 rounded-lg border border-white/5">"${a.feedback}"</p>
                        </div>
                    `;
                }

                let submissionFormHtml = '';
                if (!isSubmitted || a.submission_status !== 'approved') {
                    submissionFormHtml = `
                        <div class="mt-6 border-t border-white/5 pt-6">
                            <label class="block font-bold uppercase text-[9px] text-slate-500 mb-2 tracking-wider">Report URL or submission notes</label>
                            <div class="flex gap-2">
                                <input type="text" id="sub-input-${a.id}" placeholder="HTTPS://EXAMPLE.COM/REPORT.PDF" 
                                    class="flex-grow bg-[#0e1416] border border-white/10 p-3 rounded-xl placeholder:text-slate-600 text-xs font-semibold focus:outline-none focus:border-primary text-on-surface" />
                                <button onclick="submitAssignment(${a.id})" class="kinetic-gradient text-on-primary font-bold px-5 rounded-xl text-xs uppercase hover:scale-102 transition-all shrink-0">Submit</button>
                            </div>
                        </div>
                    `;
                }

                board.innerHTML += `
                    <div class="glass-morphism p-8 rounded-3xl border border-white/5 bg-[#171d1e]/40 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-[9px] font-black tracking-widest uppercase px-2.5 py-1 rounded-full ${statusColor}">${statusLabel}</span>
                                <span class="text-[9px] font-bold uppercase tracking-widest text-slate-500">Max Marks: ${a.marks}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white uppercase tracking-tight mb-2">${a.title}</h3>
                            <p class="text-xs text-slate-400 mb-4">${a.description || 'No description provided.'}</p>
                            
                            <div class="grid grid-cols-2 gap-4 text-[10px] font-semibold text-slate-300 mb-6 bg-black/20 p-4 border border-white/5 rounded-xl uppercase tracking-wider">
                                <div><strong class="text-slate-500">Due: </strong>${a.due_date || 'N/A'}</div>
                                <div><strong class="text-slate-500">Lab ID: </strong>${a.lab_id ? 'Lab #' + a.lab_id : 'N/A'}</div>
                                ${a.marks_obtained !== null ? `<div class="col-span-full"><strong class="text-slate-500">Marks Obtained: </strong><span class="text-green-400 font-black">${a.marks_obtained}</span> / ${a.marks}</div>` : ''}
                            </div>
                            
                            ${feedbackHtml}
                        </div>
                        ${submissionFormHtml}
                    </div>
                `;
            });
            
        } catch (e) {
            console.error(e);
            board.innerHTML = `<div class="col-span-full text-center text-red-400 text-xs uppercase font-bold">Failed to load assignments list.</div>`;
        }
    }
    
    async function submitAssignment(assignmentId) {
        const input = document.getElementById(`sub-input-${assignmentId}`);
        const fileData = input ? input.value.trim() : '';
        
        if (!fileData) {
            alert('Please enter submission details or file URL first.');
            return;
        }
        
        try {
            const res = await fetch('/api/submissions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    assignment_id: assignmentId,
                    file_data: fileData
                })
            });
            const data = await res.json();
            if (data.ok) {
                alert('Assignment submitted successfully!');
                loadAssignments();
            } else {
                alert('Failed to submit assignment: ' + (data.error || 'Unknown error'));
            }
        } catch (e) {
            console.error(e);
            alert('An error occurred during submission.');
        }
    }

    document.addEventListener('DOMContentLoaded', loadAssignments);
</script>
{% endblock %}
